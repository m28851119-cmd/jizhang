<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>我要记账</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">我要记账</div>
    <div class="slogan">数据只保存在本机 · 离线可用</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="add">记一笔</button>
    <button class="tab" data-tab="list">账单</button>
    <button class="tab" data-tab="stats">统计</button>
    <button class="tab" data-tab="cats">分类管理</button>
  </nav>

  <main>
    <!-- 记一笔 -->
    <section id="view-add" class="view">
      <div class="card form-card">
        <div class="amount-row">
          <span class="currency">¥</span>
          <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" autofocus>
        </div>
        <div class="row">
          <label for="cat1">一级分类</label>
          <select id="cat1"></select>
        </div>
        <div class="row">
          <label for="cat2">二级分类</label>
          <select id="cat2"></select>
        </div>
        <div class="row">
          <label for="date">日期</label>
          <input type="date" id="date">
        </div>
        <div class="row">
          <label for="pay">支付方式</label>
          <select id="pay">
            <option>微信</option>
            <option>支付宝</option>
            <option>现金</option>
            <option>银行卡</option>
            <option>其他</option>
          </select>
        </div>
        <div class="row">
          <label for="note">备注</label>
          <input type="text" id="note" placeholder="选填，如：和同事聚餐" maxlength="100">
        </div>
        <button id="save" class="save-btn">保存这笔账</button>
        <button id="cancel-edit" class="cancel-btn hidden">取消修改</button>
      </div>
    </section>

    <!-- 账单列表 -->
    <section id="view-list" class="view hidden">
      <div class="list-toolbar">
        <select id="filter-month" title="按月份筛选"></select>
        <select id="filter-cat" title="按分类筛选"></select>
        <input type="text" id="filter-search" placeholder="搜索备注或分类…">
        <span class="toolbar-spacer"></span>
        <button class="tool-btn" id="btn-export">导出 CSV</button>
        <button class="tool-btn" id="btn-open-folder">打开数据文件夹</button>
      </div>
      <div class="summary-bar" id="summary-bar"></div>
      <div id="list" class="list"></div>
    </section>

    <!-- 统计 -->
    <section id="view-stats" class="view hidden">
      <div class="stats-head">
        <div class="stats-title">月度统计</div>
        <div class="stats-month">
          <button class="month-nav" id="month-prev" title="上个月">‹</button>
          <input type="month" id="stats-month">
          <button class="month-nav" id="month-next" title="下个月">›</button>
        </div>
      </div>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-label">本月总支出</div>
          <div class="stat-value" id="stat-total">¥0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">日均支出</div>
          <div class="stat-value" id="stat-daily">¥0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">记账笔数</div>
          <div class="stat-value" id="stat-count">0</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="viz-card">
          <div class="viz-title">分类占比</div>
          <div class="donut-wrap">
            <svg id="donut" viewBox="0 0 200 200" width="190" height="190"></svg>
            <div class="donut-center">
              <div id="donut-center-val">¥0.00</div>
              <div class="donut-center-label">本月</div>
            </div>
          </div>
          <div class="legend" id="donut-legend"></div>
        </div>
        <div class="viz-card">
          <div class="viz-title">分类排行</div>
          <div class="rank-list" id="rank-list"></div>
        </div>
      </div>
    </section>

    <!-- 分类管理 -->
    <section id="view-cats" class="view hidden">
      <div class="list-toolbar">
        <span class="cat-manager-hint">分类清单存在账本文件里，备份 data.db 即一起备份</span>
        <span class="toolbar-spacer"></span>
        <button class="tool-btn" id="btn-restore-defaults">恢复默认分类</button>
        <button class="tool-btn primary" id="btn-add-cat1">+ 添加一级分类</button>
      </div>
      <div id="cat-list" class="cat-list"></div>
    </section>
  </main>

  <footer class="footer">数据文件：我的文档 · 我要记账数据 · data.db（可复制备份）</footer>

  <!-- 删除确认弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">确认删除</div>
      <div class="modal-text" id="modal-text"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn">取消</button>
        <button id="modal-ok" class="modal-btn danger">删除</button>
      </div>
    </div>
  </div>

  <!-- 分类输入弹窗（添加/改名） -->
  <div id="modal-cat" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title" id="cat-modal-title"></div>
      <div class="modal-text" id="cat-modal-text"></div>
      <input type="text" id="cat-modal-input" maxlength="12" placeholder="分类名称（12 字以内）">
      <div class="modal-actions">
        <button id="cat-modal-cancel" class="modal-btn">取消</button>
        <button id="cat-modal-ok" class="modal-btn primary">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="tip" class="tip hidden"></div>
  <script src="renderer.js"></script>
</body>
</html>
